<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rhulany Tech: smartphones, computadores, consoles e periféricos originais com garantia oficial e entrega em todo Moçambique."
    />
    <meta name="theme-color" content="#F5F5F7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preload" as="image" href="/videos/hero-circuit-poster.jpg" />
    <!-- Fonts load without blocking the first paint, so the loader shows at once on slow connections -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&display=swap"
      />
    </noscript>
    <title>Rhulany Tech | Tecnologia original em Maputo</title>
    <!--
      Loader: a processor chip with light running round its outline and pins lighting in turn.
      Styled here so it works before the app's CSS and JS arrive; the chip in the app
      (src/components/ui/TechChip.tsx) reuses these classes, so keep the two in step.
      It only fades in after a moment, so fast loads never see it.
    -->
    <style>
      .rt-boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #f5f5f7;
        transition:
          opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
          visibility 0s linear 0.45s;
      }
      .rt-boot--done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .rt-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        opacity: 0;
        animation: rt-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
      }
      .rt-chip {
        width: 72px;
        height: 72px;
        overflow: visible;
        color: #0c0c0d;
      }
      .rt-chip-base {
        fill: none;
        stroke: rgba(12, 12, 13, 0.14);
        stroke-width: 1.5;
      }
      .rt-chip-trace {
        fill: none;
        stroke: #0c0c0d;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-dasharray: 16 84;
        animation: rt-trace 1.8s linear infinite;
      }
      .rt-chip-core {
        fill: #0c0c0d;
        transform-box: fill-box;
        transform-origin: center;
        animation: rt-core 1.8s ease-in-out infinite;
      }
      .rt-pin {
        color: rgba(12, 12, 13, 0.16);
        stroke: currentColor;
        fill: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        animation: rt-pin 1.8s ease-in-out infinite;
        animation-delay: calc(var(--i) * 150ms);
      }
      .rt-wordmark {
        margin: 0;
        font:
          600 15px / 1 'Inter Tight',
          Inter,
          ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: -0.01em;
        color: #0c0c0d;
      }
      .rt-wordmark span {
        color: rgba(12, 12, 13, 0.4);
      }
      @keyframes rt-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes rt-trace {
        to {
          stroke-dashoffset: -100;
        }
      }
      @keyframes rt-core {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.85;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes rt-pin {
        0%,
        40%,
        100% {
          color: rgba(12, 12, 13, 0.16);
        }
        12% {
          color: #0c0c0d;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rt-chip-trace,
        .rt-pin {
          animation: none;
        }
        .rt-chip-trace {
          opacity: 0;
        }
      }
    </style>
    <noscript
      ><style>
        .rt-boot {
          display: none;
        }
      </style></noscript
    >
  </head>
  <body>
    <div id="boot" class="rt-boot" role="status" aria-label="A carregar a Rhulany Tech">
      <div class="rt-loader">
        <svg class="rt-chip" viewBox="0 0 72 72" aria-hidden="true">
          <g class="rt-pin" style="--i: 0">
            <line x1="28" y1="20" x2="28" y2="12" />
            <circle cx="28" cy="10" r="1.6" />
          </g>
          <g class="rt-pin" style="--i: 1">
            <line x1="36" y1="20" x2="36" y2="12" />
            <circle cx="36" cy="10" r="1.6" />
          </g>
          <g class="rt-pin" style="--i: 2">
            <line x1="44" y1="20" x2="44" y2="12" />
            <circle cx="44" cy="10" r="1.6" />
          </g>
          <g class="rt-pin" style="--i: 3">
            <line x1="52" y1="28" x2="60" y2="28" />
            <circle cx="62" cy="28" r="1.6" />
          </g>
          <g class="rt-pin" style="--i: 4">
            <line x1="52" y1="36" x2="60" y2="36" />
            <circle cx="62" cy="36" r="1.6" />
          </g>
          <g class="rt-pin" style="--i: 5">
            <line x1="52" y1="44" x2="60" y2="44" />
            <circle cx="62" cy="44" r="1.6" />
          </g>
          <g class="rt-pin" style="--i: 6">
            <line x1="44" y1="52" x2="44" y2="60" />
            <circle cx="44" cy="62" r="1.6" />
          </g>
          <g class="rt-pin" style="--i: 7">
            <line x1="36" y1="52" x2="36" y2="60" />
            <circle cx="36" cy="62" r="1.6" />
          </g>
          <g class="rt-pin" style="--i: 8">
            <line x1="28" y1="52" x2="28" y2="60" />
            <circle cx="28" cy="62" r="1.6" />
          </g>
          <g class="rt-pin" style="--i: 9">
            <line x1="20" y1="44" x2="12" y2="44" />
            <circle cx="10" cy="44" r="1.6" />
          </g>
          <g class="rt-pin" style="--i: 10">
            <line x1="20" y1="36" x2="12" y2="36" />
            <circle cx="10" cy="36" r="1.6" />
          </g>
          <g class="rt-pin" style="--i: 11">
            <line x1="20" y1="28" x2="12" y2="28" />
            <circle cx="10" cy="28" r="1.6" />
          </g>
          <rect class="rt-chip-base" x="20" y="20" width="32" height="32" rx="7" />
          <rect class="rt-chip-trace" x="20" y="20" width="32" height="32" rx="7" pathLength="100" />
          <rect class="rt-chip-core" x="29" y="29" width="14" height="14" rx="3" />
        </svg>
        <p class="rt-wordmark">Rhulany<span>Tech</span></p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
